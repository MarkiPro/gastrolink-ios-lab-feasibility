name: GastroLink iOS Lab — isolated macOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-lab-simulator:
    name: Link Kotlin iOS framework and build SwiftUI Lab
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout isolated feasibility source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify isolated file set
        shell: bash
        run: |
          set -euo pipefail
          test -f mobile/gastrolink-ios-feasibility/shared/build.gradle.kts
          test -f mobile/gastrolink-ios-feasibility/iosApp/project.yml
          test -f mobile/gastrolink-ios-feasibility/shared/src/iosMain/kotlin/com/gastrolink/ui/iosfeasibility/IosEntry.kt
          test -f mobile/kellner-pocket-runtime/gradlew
          test -f mobile/kellner-pocket-runtime/gradle/wrapper/gradle-wrapper.jar
          test -f mobile/kellner-pocket-runtime/gradle/wrapper/gradle-wrapper.properties

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Confirm Apple and Android toolchains
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          java -version
          test -d "${ANDROID_HOME:?Android SDK not configured}"
          test -d "$ANDROID_HOME/platforms/android-37"
          df -h .

      - name: Install XcodeGen if absent
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Link actual iOS Simulator ARM64 framework
        shell: bash
        run: |
          set -euo pipefail
          bash mobile/kellner-pocket-runtime/gradlew \
            -p mobile/gastrolink-ios-feasibility \
            :shared:linkDebugFrameworkIosSimulatorArm64 \
            --no-daemon --console=plain

      - name: Generate Xcode project and build iOS Simulator application
        shell: bash
        run: |
          set -euo pipefail
          cd mobile/gastrolink-ios-feasibility/iosApp
          xcodegen generate --spec project.yml
          xcodebuild \
            -project GastroLinkIosLab.xcodeproj \
            -scheme GastroLinkIosLab \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/.ci-ios-lab-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

      - name: Verify Simulator application artifact
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/.ci-ios-lab-derived-data/Build/Products/Debug-iphonesimulator/GastroLinkIosLab.app"
          test -d "$app"
          test -f "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"

      - name: Upload unsigned Simulator-only Lab
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gastrolink-ios-lab-simulator-unsigned
          path: .ci-ios-lab-derived-data/Build/Products/Debug-iphonesimulator/GastroLinkIosLab.app/
          if-no-files-found: error
          retention-days: 3
