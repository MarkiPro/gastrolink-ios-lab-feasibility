name: GastroLink iOS Lab — isolated macOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-lab-simulator:
    name: Link Kotlin iOS framework and build SwiftUI Lab
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout isolated feasibility source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify isolated file set
        shell: bash
        run: |
          set -euo pipefail
          test -f mobile/gastrolink-ios-feasibility/shared/build.gradle.kts
          test -f mobile/gastrolink-ios-feasibility/iosApp/project.yml
          test -f mobile/gastrolink-ios-feasibility/shared/src/iosMain/kotlin/com/gastrolink/ui/iosfeasibility/IosEntry.kt
          test -f mobile/kellner-pocket-runtime/gradlew
          test -f mobile/kellner-pocket-runtime/gradle/wrapper/gradle-wrapper.jar
          test -f mobile/kellner-pocket-runtime/gradle/wrapper/gradle-wrapper.properties

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Confirm Apple and Android toolchains
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          java -version
          # API 37 is distributed as android-37.0 on current hosted macOS images.
          # AGP compileSdk = 37 may still look up the legacy android-37 path.
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          if [[ ! -d "$sdk_root" ]]; then
            echo "::error::Android SDK root is missing: $sdk_root"
            exit 1
          fi
          echo "Android SDK root: $sdk_root"
          ls -d "$sdk_root"/platforms/android-37* || true
          if [[ ! -f "$sdk_root/platforms/android-37/android.jar" ]]; then
            if [[ ! -f "$sdk_root/platforms/android-37.0/android.jar" ]]; then
              echo "::error::Android SDK API 37/37.0 platform is not installed"
              exit 1
            fi
            if [[ -e "$sdk_root/platforms/android-37" || -L "$sdk_root/platforms/android-37" ]]; then
              echo "::error::Existing android-37 path is unusable; refusing to replace it"
              exit 1
            fi
            ln -s android-37.0 "$sdk_root/platforms/android-37"
            echo "Created runner-only android-37 compatibility symlink"
          fi
          test -f "$sdk_root/platforms/android-37/android.jar"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          df -h .

      - name: Install XcodeGen if absent
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Link actual iOS Simulator ARM64 framework
        shell: bash
        run: |
          set -euo pipefail
          bash mobile/kellner-pocket-runtime/gradlew \
            -p mobile/gastrolink-ios-feasibility \
            :shared:linkDebugFrameworkIosSimulatorArm64 \
            --no-daemon --console=plain

      - name: Generate Xcode project and build iOS Simulator application
        shell: bash
        run: |
          set -euo pipefail
          cd mobile/gastrolink-ios-feasibility/iosApp
          xcodegen generate --spec project.yml
          xcodebuild \
            -project GastroLinkIosLab.xcodeproj \
            -scheme GastroLinkIosLab \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            -derivedDataPath "$GITHUB_WORKSPACE/.ci-ios-lab-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

      - name: Verify Simulator application artifact
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/.ci-ios-lab-derived-data/Build/Products/Debug-iphonesimulator/GastroLinkIosLab.app"
          test -d "$app"
          test -f "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"

      # Only verifies boot/install/launch and records a screenshot for human review.
      # This is not an automated visual, interaction or accessibility acceptance test.
      - name: Boot iPhone 16 Pro and capture first-launch screenshot
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/.ci-ios-lab-derived-data/Build/Products/Debug-iphonesimulator/GastroLinkIosLab.app"
          test -d "$app"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          if [[ "$bundle_id" != 'com.gastrolink.ui.ioslab.feasibility' ]]; then
            echo "::error::Unexpected Lab bundle ID: $bundle_id"
            exit 1
          fi
          # Pin the runtime/device to the documented Xcode 16.4 image.
          # Do not silently substitute a different iOS version or device.
          xcrun simctl list devices available
          udid="$(xcrun simctl list -j devices available | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devices", {})
          for runtime, entries in devices.items():
              if runtime.endswith(".iOS-18-5"):
                  for entry in entries:
                      if entry.get("name") == "iPhone 16 Pro" and entry.get("isAvailable", True):
                          print(entry["udid"])
                          sys.exit(0)
          sys.exit("Required iOS 18.5 iPhone 16 Pro simulator is not available")
          ')"
          test -n "$udid"
          echo "Simulator under test: $udid (iOS 18.5, iPhone 16 Pro)"
          trap 'xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" "$bundle_id"
          sleep 5
          evidence="$GITHUB_WORKSPACE/.ci-ios-lab-evidence"
          mkdir -p "$evidence"
          screenshot="$evidence/ios18-5-iphone16pro-first-launch.png"
          xcrun simctl io "$udid" screenshot "$screenshot"
          test -s "$screenshot"
          sips -g pixelWidth -g pixelHeight "$screenshot"
          echo 'Simulator launch command and screenshot capture passed; visual and device acceptance remain pending.'

      - name: Upload iPhone simulator smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gastrolink-ios-lab-iphone16pro-smoke
          path: .ci-ios-lab-evidence/ios18-5-iphone16pro-first-launch.png
          if-no-files-found: warn
          retention-days: 3

      - name: Upload unsigned Simulator-only Lab
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gastrolink-ios-lab-simulator-unsigned
          path: .ci-ios-lab-derived-data/Build/Products/Debug-iphonesimulator/GastroLinkIosLab.app/
          if-no-files-found: error
          retention-days: 3
